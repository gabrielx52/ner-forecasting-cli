[project]
name = "adp-ner"
version = "0.1.0"
description = "CLI tool that tracks the ADP National Employment Report and forecasts the next print."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "Gabriel Meringolo" }]
dependencies = [
    "typer>=0.12",
    "pandas>=2.2",
    "statsmodels>=0.14",
]

[project.scripts]
adp-ner = "adp_ner.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "coverage>=7.6",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adp_ner"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.coverage.run]
source = ["adp_ner"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_also = ["if __name__ == .__main__.:"]

[tool.pytest.ini_options]
testpaths = ["tests"]
